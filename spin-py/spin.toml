spin_manifest_version = 2

[application]
authors = ["exruos <115374714+exruos@users.noreply.github.com>"]
description = ""
name = "football-py"
version = "0.1.0"

[variables]
db_url = { default = "postgres://postgres:postgres@localhost:5438/postgres" }

[[trigger.http]]
route = "/..."
component = "football-py"

[component.football-py]
source = "football-py.wasm"
allowed_outbound_hosts = ["postgres://*:5438"]

[component.football-py.variables]
db_url = "{{ db_url }}"

[component.football-py.build]
command = "uv run componentize-py -w spin:up/http-trigger@4.0.0 componentize app -o football-py.wasm"
watch = ["*.py", "pyproject.toml"]
