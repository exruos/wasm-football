[package]
name = "football-container-api"
authors = ["exruos <115374714+exruos@users.noreply.github.com>"]
description = "Containerized HTTP API adapter"
version = "0.1.0"
rust-version = "1.95"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["tokio", "http1", "json", "query"] }
tokio = { version = "1.5", features = ["macros", "rt-multi-thread", "net"] }
chrono = { workspace = true }
football-shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "cors"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
