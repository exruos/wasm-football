[package]
name = "teams"
authors = ["exruos <115374714+exruos@users.noreply.github.com>"]
description = ""
version = "0.1.0"
rust-version = "1.95"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json"] }
chrono = { workspace = true }
football-shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spin-sdk = { workspace = true, optional = true }
tower = { workspace = true }

[features]
wasm = ["dep:spin-sdk"]
spin-component = ["wasm"]
default = ["spin-component"]
