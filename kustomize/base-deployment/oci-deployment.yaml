apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-app
spec:
  selector:
    matchLabels:
      app: football-app
  template:
    metadata:
      labels:
        app: football-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: football-image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: football-app-secret
                  key: DB_URL
