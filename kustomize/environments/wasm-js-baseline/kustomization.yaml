apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: football

resources:
  - ../../base
  - spinapp.yaml

patches:
  - path: httproute-patch.yaml

replacements:
  - source:
      kind: Secret
      name: football-app-secret
      fieldPath: stringData.DB_URL
    targets:
      - select:
          kind: SpinApp
          name: football-app
        fieldPaths:
          - spec.variables.0.value