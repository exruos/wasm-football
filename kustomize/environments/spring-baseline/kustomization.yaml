apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: football

resources:
  - ../../base
  - ../../base-deployment

images:
  - name: football-image
    newName: localhost:5000/football-kotlin
    newTag: spring

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: football-app