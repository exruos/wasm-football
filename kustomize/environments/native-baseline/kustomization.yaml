apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: football

resources:
  - ..\spring-baseline

patches:
  - target:
      kind: Deployment
      name: football-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/image
        value: localhost:5000/football-kotlin:native