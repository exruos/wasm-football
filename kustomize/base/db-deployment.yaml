apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: football-db
  template:
    metadata:
      labels:
        app: football-db
    spec:
      containers:
        - name: football-db
          image: localhost:5000/football-db:postgres-18.4
          args: ["-p", "5438"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: football-app-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5438
          resources:
            requests:
              memory: "128Mi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-p", "5438", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
