apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: postgres-db-clean-service
          image: registry.gitlab.com/envite-consulting/sustainable-software-architecture/football-databases:postgres-17.7
          args: ["-p", "5438"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: football-app-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5438
          resources:
            requests:
              memory: "128Mi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-p", "5438", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
