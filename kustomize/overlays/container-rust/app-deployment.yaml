apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-container-rust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: football-container-rust
  template:
    metadata:
      labels:
        app: football-container-rust
    spec:
      containers:
        - name: app
          image: ghcr.io/exruos/container-football:v1.3
          ports:
            - containerPort: 3000
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: football-app-secret
                  key: DB_URL
