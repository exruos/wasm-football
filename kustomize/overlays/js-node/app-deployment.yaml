apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-js-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: football-js-node
  template:
    metadata:
      labels:
        app: football-js-node
    spec:
      containers:
        - name: app
          image: localhost:5000/football-js-node:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: football-app-secret
                  key: DB_URL
