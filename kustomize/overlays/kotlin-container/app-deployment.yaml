apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-kotlin-container
spec:
  replicas: 1
  selector:
    matchLabels:
      app: football-kotlin-container
  template:
    metadata:
      labels:
        app: football-kotlin-container
    spec:
      containers:
      - name: football-kotlin-container
        image: localhost:5000/football-spring:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://football-db:5438/postgres"
        - name: THC_PATH
          value: "/actuator/health"
        - name: THC_PORT
          value: "8080"
        - name: MATCH_REST_TEAM_NAME_STRATEGY
          value: "POJO_WITHOUT_CACHE"
        - name: MATCH_REST_TEAM_SERVICE_BASE_URL
          value: "http://localhost:8080"
        - name: SPRING_FLYWAY_ENABLED
          value: "false"
        - name: JAVA_TOOL_OPTIONS
          value: "-Djavax.net.ssl.sessionCacheSize=10000 -Djdk.tls.client.enableSessionTicketExtension=true -Djdk.tls.server.enableSessionTicketExtension=true"
        livenessProbe:
          exec:
            command: ["/workspace/health-check"]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
