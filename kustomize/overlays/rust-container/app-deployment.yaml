apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-rust-container
spec:
  replicas: 2
  selector:
    matchLabels:
      app: football-rust-container
  template:
    metadata:
      labels:
        app: football-rust-container
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: localhost:5000/football-rust-container:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: football-app-secret
                  key: DB_URL
