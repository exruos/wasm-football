apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -rust-wasm

resources:
  - ../../base
  - spinapp.yaml

replacements:
  - source:
      kind: Secret
      name: football-app-secret
      fieldPath: stringData.DB_URL
    targets:
      - select:
          kind: SpinApp
          name: wasm-football-rust-wasm
        fieldPaths:
          - spec.variables.0.value
