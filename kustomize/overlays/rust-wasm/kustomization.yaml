apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: football

resources:
  - ../../base
  - spinapp.yaml

replacements:
  - source:
      kind: Secret
      name: football-app-secret
      fieldPath: stringData.DB_URL
    targets:
      - select:
          kind: SpinApp
          name: football-rust-wasm
        fieldPaths:
          - spec.variables.0.value
  - source:
      kind: SpinApp
      name: football-rust-wasm
      fieldPath: metadata.name
    targets:
      - select:
          kind: Ingress
          name: football-app
        fieldPaths:
          - spec.rules.0.http.paths.0.backend.service.name
